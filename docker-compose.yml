name: team-project

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo-data:/data/db

  app:
    image: destinyship/dev-projects-app:1.0.0
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/dev-project?authSource=admin
    depends_on:
      - mongo
volumes:
  mongo-data:
